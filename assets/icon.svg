      <path d="M126 40 A166 166 0 0 0 126 264" opacity="0.3"/>
      <path d="M386 40 A166 166 0 0 1 386 264" opacity="0.3"/>
    </g>

    <!-- Pylône en treillis -->
    <g stroke="url(#brass)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M256 152 L196 420 M256 152 L316 420" stroke-width="16"/>
      <path d="M236 242 L276 242 M222 304 L290 304 M208 366 L304 366" stroke-width="10"/>
      <path d="M241 210 L276 242 L222 304 L290 304 L208 366 L304 366 L196 420" stroke-width="7" opacity="0.85"/>
    </g>

    <!-- Balise -->
    <circle cx="256" cy="152" r="46" fill="url(#glow)"/>
    <circle cx="256" cy="152" r="17" fill="#e8654c"/>
    <circle cx="251" cy="147" r="5" fill="#ffd2c4"/>

    <!-- Forêt de Chernarus -->
    <path fill="#1a221f" d="
      M16 496 L16 440 L40 440 L62 372 L84 440 L96 440 L122 352 L148 440 L160 440 L180 396 L200 440
      L312 440 L332 396 L352 440 L364 440 L390 352 L416 440 L428 440 L450 372 L472 440 L496 440 L496 496 Z"/>
    <rect x="16" y="436" width="480" height="60" fill="#1a221f"/>

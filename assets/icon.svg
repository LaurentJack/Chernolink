<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3034"/>
      <stop offset="1" stop-color="#111315"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf7a"/>
      <stop offset="1" stop-color="#b8892f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a5c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a5c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <!-- Ondes radio -->
    <g fill="none" stroke="url(#brass)" stroke-linecap="round" stroke-width="18">
      <path d="M206 108 A70 70 0 0 0 206 196" opacity="0.95"/>
      <path d="M306 108 A70 70 0 0 1 306 196" opacity="0.95"/>
